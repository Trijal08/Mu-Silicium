# Image validation overrides for Apple A-series silicon.
#
# Apple cores (e.g. A9/S8003) run the MMU with a 16 KB translation granule, so
# DXE drivers and applications are linked with 16 KB section alignment (see
# ApplePkg.dsc.inc BuildOptions) instead of the usual 4 KB, letting the DxeCore
# memory-protection policy apply per-section RO/NX at the granule the MMU uses.
#
# DXE_CORE is intentionally left at 4 KB (it is loaded by PrePi, which only
# aligns to 4 KB), so it must still validate against the 4 KB DEFAULT profile.
# DXE_RUNTIME_DRIVER stays at 0x10000 (inherited from the default config).
#
# This file is merged over the default configuration
# (Mu_Basecore/.pytool/Plugin/ImageValidation/image_validation.cfg): the merge
# replaces whole per-architecture profiles, so only the three profiles that link
# at 16 KB are provided here; DEFAULT (4 KB), DXE_CORE, DXE_RUNTIME_DRIVER, SEC,
# PEI, etc. are inherited from the default unchanged.

IMAGE_FILE_MACHINE_ARM64:
    DXE_DRIVER:
        DATA_CODE_SEPARATION: true
        ALIGNMENT:
            - COMPARISON: "=="
              VALUE: 0x4000
    UEFI_DRIVER:
        DATA_CODE_SEPARATION: true
        ALIGNMENT:
            - COMPARISON: "=="
              VALUE: 0x4000
    UEFI_APPLICATION:
        DATA_CODE_SEPARATION: true
        ALIGNMENT:
            - COMPARISON: "=="
              VALUE: 0x4000
