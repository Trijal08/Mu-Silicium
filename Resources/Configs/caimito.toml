#
# Device Status Configs
#
[status]
model_count = 5

#
# Boot Shim Configs
#
[boot_shim]
requires_kernel_header = true

#
# UEFI FD Configs
#
[uefi_fd]
base = 0xA0011000
size = 0x601000

#
# Android Boot Image Kernel Configs
#
[boot_image_kernel]
kernel_compression = "lz4"
append_dtb         = false

#
# Android Boot Image Configs
#
[boot_image]
header_version = 4
